# XcodeGen fallback: `brew install xcodegen && xcodegen generate`
# Use this only if the committed Lumen.xcodeproj fails to open (it requires Xcode 16+).
name: Lumen
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  LumenKit:
    path: Packages/LumenKit
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEAD_CODE_STRIPPING: YES
  configs:
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
targets:
  Lumen:
    type: application
    platform: iOS
    sources:
      - path: Lumen
        excludes:
          - Support/Info.plist
          - Support/Lumen.entitlements
    dependencies:
      - package: LumenKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.lumen
        INFOPLIST_FILE: Lumen/Support/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Lumen/Support/Lumen.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_STRICT_CONCURRENCY: complete
      configs:
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-Osize"
  LumenTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LumenTests]
    dependencies:
      - target: Lumen
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.lumen.tests
  LumenUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [LumenUITests]
    dependencies:
      - target: Lumen
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.lumen.uitests
        TEST_TARGET_NAME: Lumen
schemes:
  Lumen:
    build:
      targets:
        Lumen: all
    test:
      targets: [LumenTests, LumenUITests]
