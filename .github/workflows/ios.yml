name: iOS

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app || true
      - name: LumenKit tests
        run: swift test --package-path Packages/LumenKit
      - name: Build and test app
        run: |
          DEST=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          xcodebuild test -project Lumen.xcodeproj -scheme Lumen \
            -destination "id=$DEST" \
            -quiet CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO
